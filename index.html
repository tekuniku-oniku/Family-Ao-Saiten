2},{"ids":[10],"pts":2},{"ids":[11],"pts":2},{"ids":[12],"pts":2},{"ids":[13],"pts":2},{"ids":[14],"pts":2},{"ids":[15],"pts":2},{"ids":[16],"pts":3},{"ids":[17],"pts":3},{"ids":[18,19,20,21],"pts":3},{"ids":[22],"pts":3},{"ids":[23],"pts":3},{"ids":[24],"pts":3},{"ids":[25],"pts":3},{"ids":[26],"pts":3},{"ids":[27],"pts":2},{"ids":[28],"pts":2},{"ids":[29],"pts":3},{"ids":[30,31,32,33],"pts":3},{"ids":[34],"pts":3},{"ids":[35,36],"pts":3},{"ids":[37],"pts":3},{"ids":[38],"pts":3},{"ids":[39,40],"pts":3},{"ids":[41],"pts":3},{"ids":[42],"pts":3},{"ids":[43],"pts":3},{"ids":[44],"pts":2},{"ids":[45],"pts":2},{"ids":[46,47],"pts":3,"anyOrder":true},{"ids":[48],"pts":3},{"ids":[49],"pts":2}],"sections":[[1,5,"第1問"],[6,15,"第2問"],[16,23,"第3問"],[24,29,"第4問"],[30,38,"第5問"],[39,49,"第6問"]]},"ct_listening":{"label":"英語リスニング","full":100,"keys":[3,3,4,1,2,3,4,2,4,1,4,2,2,2,4,3,1,2,1,4,3,5,6,4,2,1,4,3,6,1,4,1,4,2,4,1,2],"units":[{"ids":[1],"pts":4},{"ids":[2],"pts":4},{"ids":[3],"pts":4},{"ids":[4],"pts":4},{"ids":[5],"pts":3},{"ids":[6],"pts":3},{"ids":[7],"pts":3},{"ids":[8],"pts":4},{"ids":[9],"pts":4},{"ids":[10],"pts":4},{"ids":[11],"pts":4},{"ids":[12],"pts":3},{"ids":[13],"pts":3},{"ids":[14],"pts":3},{"ids":[15],"pts":3},{"ids":[16],"pts":3},{"ids":[17],"pts":3},{"ids":[18,19,20,21],"pts":4},{"ids":[22],"pts":1},{"ids":[23],"pts":1},{"ids":[24],"pts":1},{"ids":[25],"pts":1},{"ids":[26],"pts":4},{"ids":[27],"pts":3},{"ids":[28,29],"pts":2},{"ids":[30,31],"pts":2},{"ids":[32],"pts":4},{"ids":[33],"pts":4},{"ids":[34],"pts":3},{"ids":[35],"pts":3},{"ids":[36],"pts":4},{"ids":[37],"pts":4}],"sections":[[1,7,"第1問"],[8,11,"第2問"],[12,17,"第3問"],[18,26,"第4問"],[27,33,"第5問"],[34,37,"第6問"]]}};
const A_EN=[{name:'Ⅰ 会話文空所補充',num:5,pt:2,from:1,to:5},{name:'Ⅱ 会話文整序',num:5,pt:2,from:6,to:10},{name:'Ⅲ 文法・語彙',num:10,pt:2,from:11,to:20},{name:'Ⅳ 語句整序',num:10,pt:2,from:21,to:30},{name:'Ⅴ 長文空所補充',num:5,pt:4,from:31,to:35},{name:'Ⅵ 長文読解',num:5,pt:4,from:36,to:40}];
const A_SUB=['a_english','a_japanese','a_physics'];const C_SUB=['ct_japanese','ct_physics','ct_reading','ct_listening'];const label={a_english:'英語',a_japanese:'国語（現代文）',a_physics:'物理',ct_japanese:'国語',ct_physics:'物理',ct_reading:'英語リーディング',ct_listening:'英語リスニング'};
const storeKey='family-scoring-2024-2025-v2';const oldKey='family-2025-3subjects-v1';
const init={exam:'a',page:'answer',aSubject:'a_english',ctSubject:'ct_japanese',aMethod:'weighted',a_english:[0,0,0,0,0,0],a_japanese:Array(24).fill(false),a_physics:Array(32).fill(false)};
for(const s of C_SUB)init[s]=Array(COMMON[s].keys.length).fill(null);
let state=JSON.parse(JSON.stringify(init));
try{const data=JSON.parse(localStorage.getItem(storeKey)||'null');if(data&&typeof data==='object'){if(['a','ct'].includes(data.exam))state.exam=data.exam;if(['answer','summary'].includes(data.page))state.page=data.page;if(A_SUB.includes(data.aSubject))state.aSubject=data.aSubject;if(C_SUB.includes(data.ctSubject))state.ctSubject=data.ctSubject;if(['weighted','equal'].includes(data.aMethod))state.aMethod=data.aMethod;for(const s of A_SUB){if(Array.isArray(data[s])&&data[s].length===state[s].length)state[s]=data[s].map((v,i)=>s==='a_english'?Math.min(A_EN[i].num,Math.max(0,Math.round(Number(v)||0))):Boolean(v))}for(const s of C_SUB){if(Array.isArray(data[s])&&data[s].length===state[s].length)state[s]=data[s].map(v=>(Number.isInteger(v)&&v>=1&&v<=9)?v:null)}}else{const old=JSON.parse(localStorage.getItem(oldKey)||'null');if(old){if(Array.isArray(old.english)&&old.english.length===6)state.a_english=old.english.map((v,i)=>Math.min(A_EN[i].num,Math.max(0,Math.round(Number(v)||0))));if(Array.isArray(old.japanese)&&old.japanese.length===24)state.a_japanese=old.japanese.map(Boolean);if(Array.isArray(old.physics)&&old.physics.length===32)state.a_physics=old.physics.map(Boolean);if(['weighted','equal'].includes(old.method))state.aMethod=old.method}}}catch(e){}

function AScore(s){if(s==='a_english')return A_EN.reduce((sum,d,i)=>sum+state.a_english[i]*(state.aMethod==='weighted'?d.pt:2.5),0);return state[s].filter(Boolean).length*100/state[s].length}
function commonScore(s){const d=COMMON[s];let points=0;const units=[];for(const u of d.units){const vals=u.ids.map(i=>state[s][i-1]);let pts=0;if(u.ids.length===1&&u.alternate&&vals[0]!==d.keys[u.ids[0]-1])pts=u.alternate[String(vals[0])]||0;else if(vals.every(v=>v!==null)){const keys=u.ids.map(i=>d.keys[i-1]);const valid=u.anyOrder?[...vals].sort().join(',')===[...keys].sort().join(','):vals.every((v,i)=>v===keys[i]);if(valid)pts=u.pts}points+=pts;units.push({ids:u.ids,possible:u.pts,points:pts,answered:vals.every(v=>v!==null),values:vals,keys:u.ids.map(i=>d.keys[i-1])})}return {points,units,answered:state[s].filter(v=>v!==null).length,max:d.keys.length}}

function topUI(){const a=state.exam==='a';$('exam-a').setAttribute('aria-selected',String(a));$('exam-ct').setAttribute('aria-selected',String(!a));$('nav-answer').setAttribute('aria-selected',String(state.page==='answer'));$('nav-summary').setAttribute('aria-selected',String(state.page==='summary'))}
function subjectNav(){const box=el('div',{class:'subjects'+(state.exam==='a'?' three':'')});for(const s of state.exam==='a'?A_SUB:C_SUB){const b=el('button',{type:'button','aria-selected':String(shownSub()===s)},label[s]);const count=state.exam==='a'?(s==='a_english'?state[s].reduce((a,b)=>a+b,0):state[s].filter(Boolean).length):commonScore(s).answered;const max=state.exam==='a'?(s==='a_english'?40:state[s].length):COMMON[s].keys.length;b.append(el('small',{},`${count} / ${max} 入力`));b.addEventListener('click',()=>chooseSub(s));box.append(b)}return box}
function answerPage(){const host=$('app-content');const s=shownSub();let card=el('section',{class:'card'}),bar=el('div',{class:'toolbar'}),left=el('div');left.append(el('div',{class:'eyebrow'},state.exam==='a'?'2025年度 A日程':'令和6年度（2024年度）本試験'),el('h2',{class:'title'},'解答入力'),el('p',{class:'description'},'科目を選んで解答を入力してください。正解や点数は「採点・集計」ページで確認できます。'));bar.append(left);card.append(bar,subjectNav());let info=el('div',{class:'toolbar'});const filled=state.exam==='a'?(s==='a_english'?state[s].reduce((a,b)=>a+b,0):state[s].filter(Boolean).length):commonScore(s).answered,max=state.exam==='a'?(s==='a_english'?40:state[s].length):COMMON[s].keys.length;info.append(el('div',{class:'progresspill'},`${filled} / ${max} ${state.exam==='a'?'正解として入力':'入力済み'}`));const reset=el('button',{class:'button outline',type:'button'},'この科目をリセット');reset.addEventListener('click',()=>{if(!confirm(label[s]+'の入力を消去しますか？'))return;state[s]=state.exam==='a'?(s==='a_english'?A_EN.map(()=>0):state[s].map(()=>false)):state[s].map(()=>null);draw()});info.append(reset);card.append(info);let progress=el('div',{class:'progressbar'});let fill=el('div');fill.style.width=(filled/max*100)+'%';progress.append(fill);card.append(progress);host.append(card);
if(state.exam==='a')drawAAnswer(host,s);else drawCTAnswer(host,s);
const nav=el('div',{class:'actions'}),next=el('button',{class:'button',type:'button'},'採点・集計を見る');next.addEventListener('click',()=>setPage('summary'));nav.append(next);host.append(nav);
}
function drawAAnswer(host,s){let panel=el('section',{class:'card'});panel.append(el('h3',{class:'title'},label[s]+' の入力'));if(s==='a_english'){
const methods=el('div',{class:'methods'});for(const [id,txt] of [['weighted','長文重視の仮配点'],['equal','全問均等（2.5点）']]){const btn=el('button',{class:'method',type:'button','aria-pressed':String(state.aMethod===id)},txt);btn.addEventListener('click',()=>{state.aMethod=id;draw()});methods.append(btn)}panel.append(methods,el('p',{class:'description'},'大問ごとの正解数を入力してください（公式解答との照合はご自身で行ってください）。'));for(let i=0;i<A_EN.length;i++){let d=A_EN[i],row=el('div',{class:'a-row'}),text=el('div');text.append(el('b',{},d.name),el('small',{},`解答番号 ${d.from}〜${d.to} / ${d.num}問`));const step=el('div',{class:'stepper'});let minus=el('button',{type:'button','aria-label':d.name+'の正解数を減らす'},'−'),input=el('input',{type:'number',inputmode:'numeric',min:'0',max:String(d.num),'aria-label':d.name+'の正解数'}),plus=el('button',{type:'button','aria-label':d.name+'の正解数を増やす'},'+');input.value=state[s][i];minus.disabled=state[s][i]===0;plus.disabled=state[s][i]===d.num;minus.addEventListener('click',()=>{state[s][i]=Math.max(0,state[s][i]-1);draw()});plus.addEventListener('click',()=>{state[s][i]=Math.min(d.num,state[s][i]+1);draw()});input.addEventListener('change',()=>{state[s][i]=Math.max(0,Math.min(d.num,Math.round(Number(input.value)||0)));draw()});step.append(minus,input,plus);const pts=el('div',{class:'a-points'},fmt(state[s][i]*(state.aMethod==='weighted'?d.pt:2.5))+'点');pts.append(el('small',{},`最大 ${d.num*(state.aMethod==='weighted'?d.pt:2.5)}点`));row.append(text,step,pts);panel.append(row)}
}else{panel.append(el('p',{class:'description'},'正解した解答番号だけをタップしてください。実際の選択肢の番号ではなく、正解／不正解の記録です。'));for(let start=0;start<state[s].length;start+=10){panel.append(el('h4',{class:'grouphead'},`解答番号 ${start+1}〜${Math.min(start+10,state[s].length)}`));const grid=el('div',{class:'mark-grid'});for(let i=start;i<Math.min(start+10,state[s].length);i++){let b=el('button',{type:'button','aria-pressed':String(state[s][i]),'aria-label':`解答番号${i+1} ${state[s][i]?'正解':'未正解'}`},String(i+1));b.append(el('small',{},state[s][i]?'正解':'未正解'));b.addEventListener('click',()=>{state[s][i]=!state[s][i];draw()});grid.append(b)}panel.append(grid)}}host.append(panel,el('div',{class:'notice'},'A日程は正式な設問別配点が不明なため参考点です。英語は大問別正解数、国語は現代文24問、物理は32問の正誤を記録します。旧ツールの入力がある場合は初回のみ引き継ぎます。'))}
function drawCTAnswer(host,s){const d=COMMON[s];const note=el('section',{class:'notice'},'令和6年度（2024年1月実施）の大学入学共通テスト【本試験】用です。問題の「解答番号」と入力欄を対応させてください。物理は「物理基礎」ではなく「物理」です。'),article=el('div');host.append(note);for(const [start,end,title] of d.sections){const titleRow=el('div',{class:'grouphead'});titleRow.append(el('h3',{},title),el('small',{},`解答番号 ${start}〜${end}`));article.append(titleRow);const grid=el('div',{class:'answer-grid'});for(let i=start;i<=end;i++){const val=state[s][i-1];const row=el('div',{class:'answer-item'+(val!==null?' answered':'')});const top=el('div',{class:'item-top'});top.append(el('strong',{},'解答番号 '+String(i).padStart(2,'0')));const clear=el('button',{class:'erase',type:'button','aria-label':`解答番号${i}を消去`},'消去');clear.disabled=val===null;clear.addEventListener('click',()=>{state[s][i-1]=null;row.replaceWith(ctRow(s,i));save();subjectCountRefresh()});top.append(clear);const choices=el('div',{class:'choices',role:'group','aria-label':`解答番号 ${i} の選択肢`});for(let n=1;n<=9;n++){const b=el('button',{type:'button','aria-pressed':String(val===n),'aria-label':`解答番号${i}の選択肢${n}`},String(n));b.addEventListener('click',()=>{state[s][i-1]=n;row.replaceWith(ctRow(s,i));save();subjectCountRefresh()});choices.append(b)}row.append(top,choices);grid.append(row)}article.append(grid)}host.append(article);const special=s==='ct_reading'?'18〜21、30〜33、35〜36、39〜40、46〜47は、複数欄がすべて正解した場合に得点します。46〜47は順不同です。':s==='ct_listening'?'18〜21、28〜29、30〜31は、複数欄がすべて正解した場合に得点します。':s==='ct_physics'?'解答番号11は、正解4なら5点、3を選んだ場合は1点です。':'大問別にそれぞれ50点満点、計200点です。';host.append(el('div',{class:'notice'},'採点上の注意：'+special));
function ctRow(sub,i){const val=state[sub][i-1];const row=el('div',{class:'answer-item'+(val!==null?' answered':'')});const top=el('div',{class:'item-top'});top.append(el('strong',{},'解答番号 '+String(i).padStart(2,'0')));const clear=el('button',{class:'erase',type:'button','aria-label':`解答番号${i}を消去`},'消去');clear.disabled=val===null;clear.addEventListener('click',()=>{state[sub][i-1]=null;row.replaceWith(ctRow(sub,i));subjectCountRefresh()});top.append(clear);const choices=el('div',{class:'choices',role:'group','aria-label':`解答番号 ${i} の選択肢`});for(let n=1;n<=9;n++){const b=el('button',{type:'button','aria-pressed':String(val===n),'aria-label':`解答番号${i}の選択肢${n}`},String(n));b.addEventListener('click',()=>{state[sub][i-1]=n;row.replaceWith(ctRow(sub,i));subjectCountRefresh()});choices.append(b)}row.append(top,choices);return row}
function subjectCountRefresh(){const ct=commonScore(s);const info=document.querySelector('.progresspill');if(info)info.textContent=ct.answered+' / '+ct.max+' 入力済み';const bar=document.querySelector('.progressbar div');if(bar)bar.style.width=ct.answered/ct.max*100+'%';const active=document.querySelector('.subjects [aria-selected=true] small');if(active)active.textContent=ct.answered+' / '+ct.max+' 入力';save()}
}
function summaryPage(){const host=$('app-content'),all=allResults();const max=all.reduce((a,s)=>a+s.max,0),score=all.reduce((a,s)=>a+s.points,0);const completed=state.exam==='a'?false:all.every(s=>s.answered===s.answerMax);const hero=el('section',{class:'card summary-head'}),bar=el('div',{class:'toolbar'}),text=el('div');text.append(el('div',{class:'eyebrow',style:'color:#b8e8d9'},state.exam==='a'?'2025年度 A日程 / 参考採点':'令和6年度 共通テスト / 公式配点'),el('h2',{class:'title'},'採点・集計'));text.append(el('div',{class:'score-big'},`${fmt(score)} `));text.querySelector('.score-big').append(el('span',{},`/ ${max}点`));text.append(el('p',{class:'description'},state.exam==='ct'?(completed?'4科目すべて入力済み':'未入力は0点として暫定集計しています'):'大問別正解数等から算出した非公式の参考点です'));bar.append(text);hero.append(bar);host.append(hero);
const cards=el('div',{class:'results-grid'});for(const item of all){const c=el('section',{class:'result'});c.append(el('div',{class:'result-name'},item.name));const points=el('div');points.append(el('strong',{},fmt(item.points)+'点'),el('small',{},` / ${item.max}点`));c.append(points);const bar=el('div',{class:'progressbar'}),fill=el('div');fill.style.width=item.points/item.max*100+'%';bar.append(fill);c.append(bar,el('div',{class:'result-bottom'},state.exam==='ct'?`${item.answered} / ${item.answerMax} 解答欄入力済み`:`${item.answered} / ${item.answerMax}問 正解として記録`));const go=el('button',{type:'button',class:'button outline',style:'margin-top:14px;width:100%'},'この科目の解答を編集');go.addEventListener('click',()=>{if(state.exam==='a')state.aSubject=item.key;else state.ctSubject=item.key;setPage('answer')});c.append(go);cards.append(c)}host.append(cards);
if(state.exam==='ct'){const breakdown=el('div',{class:'summary-grid'});for(const s of C_SUB){const d=COMMON[s],sc=commonScore(s),c=el('section',{class:'card'});c.append(el('h3',{class:'title'},label[s]+' の詳細'));for(const [start,end,title] of d.sections){const blocks=sc.units.filter(u=>u.ids.some(i=>i>=start&&i<=end));const scored=blocks.reduce((t,u)=>t+u.points,0),maximum=blocks.reduce((t,u)=>t+u.possible,0);const row=el('div',{class:'section-score'});row.append(el('span',{},title),el('strong',{},`${scored} / ${maximum}点`));c.append(row)}const incorrect=sc.units.filter(u=>u.points<u.possible&&u.answered),blanks=sc.units.filter(u=>!u.answered);const details=el('details');const summary=el('summary',{class:'minor',style:'cursor:pointer;margin-top:12px;font-weight:750'},`不正解 ${incorrect.length}組 / 未入力 ${blanks.length}組（タップで詳細）`);details.append(summary);let wrong=el('div',{class:'miss'});for(const u of incorrect){const str=`${u.ids.join('・')}: ${u.values.join(' / ')} → ${u.keys.join(' / ')}${u.points?' ('+u.points+'点)':''}`;wrong.append(el('span',{},str))}for(const u of blanks)wrong.append(el('span',{class:'blank'},'未入力 '+u.ids.join('・')));details.append(wrong);c.append(details);breakdown.append(c)}host.append(breakdown);const links=el('section',{class:'card note-links'});links.append(el('h3',{class:'title'},'公式資料（大学入試センター）'));const p=el('div');for(const [url,name] of [['https://www.dnc.ac.jp/kyotsu/kakomondai/r6/r6_honsiken_seikai.html','本試験の正解・配点'],['https://www.dnc.ac.jp/kyotsu/kakomondai/r6/r6_honshiken_mondai.html','本試験の問題']]){const a=el('a',{href:url,target:'_blank',rel:'noopener noreferrer'},name);p.append(a)}links.append(p,el('p',{class:'description'},'複数解答の一括採点および物理の部分点も公式配点に準拠しています。解答入力はご本人のマーク番号です。'));host.append(links)}else host.append(el('section',{class:'notice'},'A日程の採点結果は公式の科目別配点に基づくものではありません。国語は現代文24欄のみを対象とし、英語は長文重視／全問均等の仮配点です。'));
const actions=el('section',{class:'card'});actions.append(el('h3',{class:'title'},'採点結果を保存・共有'));const buttons=el('div',{class:'actions'});const copy=el('button',{class:'button outline',type:'button'},'結果をコピー');copy.addEventListener('click',()=>copyResults());const share=el('button',{class:'button',type:'button'},'結果を共有');share.addEventListener('click',()=>shareResults());const print=el('button',{class:'button outline',type:'button'},'印刷 / PDF保存');print.addEventListener('click',()=>window.print());buttons.append(copy,share,print);actions.append(buttons,el('p',{class:'description',style:'margin-top:13px'},'共有するのは採点結果のテキストです。入力した選択肢や解答履歴が自動で家族に送られることはありません。'));host.append(actions)
}
function resultsText(){let all=allResults(),max=all.reduce((a,s)=>a+s.max,0),score=all.reduce((a,s)=>a+s.points,0);return (state.exam==='a'?'2025年度 A日程 3教科 自己採点（仮）':'令和6年度（2024年度）共通テスト 本試験')+'\n'+all.map(s=>`${s.name}: ${fmt(s.points)}/${s.max}点（入力 ${s.answered}/${s.answerMax}）`).join('\n')+`\n合計: ${fmt(score)}/${max}点`+(state.exam==='a'?'\n※非公式の仮配点による点数':'\n※未入力欄は0点として集計')}
async function copyResults(){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(resultsText());else {const t=el('textarea');t.value=resultsText();t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();if(!document.execCommand('copy'))throw Error('copy');t.remove()}toast('集計結果をコピーしました')}catch(e){toast('コピーできません。共有を試してください')}}
async function shareResults(){if(navigator.share)try{await navigator.share({title:'過去問 採点結果',text:resultsText()});return}catch(e){if(e.name==='AbortError')return}copyResults()}
$('exam-a').addEventListener('click',()=>changeExam('a'));$('exam-ct').addEventListener('click',()=>changeExam('ct'));$('nav-answer').addEventListener('click',()=>setPage('answer'));$('nav-summary').addEventListener('click',()=>setPage('summary'));

})();
